# Standalone Ansible playbook voor R-DRT-01
# Uitvoeren: ansible-playbook -i 192.168.0.130, new_R-DRT-01_Router-4.yml
---
- name: Configureer R-DRT-01
  hosts: all
  gather_facts: false
  vars:
    ansible_connection: ansible.netcommon.network_cli
    ansible_network_os: cisco.ios.ios
    ansible_user: admin
    ansible_password: "<WACHTWOORD>"
    ansible_become: true
    ansible_become_method: enable
    ansible_become_password: "<WACHTWOORD>"
    router_secret: "<WACHTWOORD>"

  tasks:
    - name: 1. Basisinstellingen
      cisco.ios.ios_config:
        lines:
          - hostname R-DRT-01
          - no ip domain-lookup
          - ip domain-name heh.local
          - enable secret {{ router_secret }}
          - username admin privilege 15 secret {{ router_secret }}
          - service password-encryption

    - name: 2.1 Ingebouwde poort GigabitEthernet0/0/0 uitschakelen
      cisco.ios.ios_config:
        parents: interface GigabitEthernet0/0/0
        lines:
          - description Ongebruikt (alle links zitten op de NIM)
          - shutdown

    - name: 2.2 Ingebouwde poort GigabitEthernet0/0/1 uitschakelen
      cisco.ios.ios_config:
        parents: interface GigabitEthernet0/0/1
        lines:
          - description Ongebruikt (alle links zitten op de NIM)
          - shutdown

    - name: 3.1 VLAN 30 (Studenten-Gasten)
      cisco.ios.ios_config:
        parents: vlan 30
        lines:
          - name Studenten-Gasten

    - name: 3.2 VLAN 31 (Medewerkers)
      cisco.ios.ios_config:
        parents: vlan 31
        lines:
          - name Medewerkers

    - name: 3.3 VLAN 101 (WAN-NSP-DRT)
      cisco.ios.ios_config:
        parents: vlan 101
        lines:
          - name WAN-NSP-DRT

    - name: 3.4 VLAN 102 (WAN-ELB-DRT)
      cisco.ios.ios_config:
        parents: vlan 102
        lines:
          - name WAN-ELB-DRT

    - name: 4.1 NIM-poort GigabitEthernet0/1/0
      cisco.ios.ios_config:
        parents: interface GigabitEthernet0/1/0
        lines:
          - description ge0/1/0 - WAN VLAN102 naar SW-ELB-02 Gi1/0/5
          - switchport mode access
          - switchport access vlan 102
          - spanning-tree portfast
          - no shutdown

    - name: 4.2 NIM-poort GigabitEthernet0/1/1
      cisco.ios.ios_config:
        parents: interface GigabitEthernet0/1/1
        lines:
          - description ge0/1/1 - trunk naar SW-DRT-01 gi1
          - switchport mode trunk
          - switchport trunk allowed vlan 30,31
          - no shutdown

    - name: 4.3 NIM-poort GigabitEthernet0/1/2
      cisco.ios.ios_config:
        parents: interface GigabitEthernet0/1/2
        lines:
          - description ge0/1/2 - WAN VLAN101 naar R-NSP-01 Gi0/1/2
          - switchport mode access
          - switchport access vlan 101
          - no shutdown

    - name: 4.4 NIM-poort GigabitEthernet0/1/3
      cisco.ios.ios_config:
        parents: interface GigabitEthernet0/1/3
        lines:
          - description Ongebruikt
          - shutdown

    - name: 5.0 SVI Vlan1 uitschakelen
      cisco.ios.ios_config:
        parents: interface Vlan1
        lines:
          - shutdown

    - name: 5.1 SVI Vlan30
      cisco.ios.ios_config:
        parents: interface Vlan30
        lines:
          - description VLAN 30 Studenten/gasten (gateway)
          - ip address 10.3.0.1 255.255.255.0
          - ip helper-address 10.1.1.10
          - ip helper-address 10.1.1.11
          - no shutdown

    - name: 5.2 SVI Vlan31
      cisco.ios.ios_config:
        parents: interface Vlan31
        lines:
          - description VLAN 31 Medewerkers (gateway)
          - ip address 10.3.1.1 255.255.255.0
          - ip helper-address 10.1.1.10
          - ip helper-address 10.1.1.11
          - no shutdown

    - name: 5.3 SVI Vlan101
      cisco.ios.ios_config:
        parents: interface Vlan101
        lines:
          - description WAN Nunspeet - Dronten
          - ip address 192.168.0.66 255.255.255.240
          - no shutdown

    - name: 5.4 SVI Vlan102
      cisco.ios.ios_config:
        parents: interface Vlan102
        lines:
          - description WAN Elburg - Dronten
          - ip address 192.168.0.130 255.255.255.240
          - no shutdown

    - name: 6. Statische routes
      cisco.ios.ios_config:
        lines:
          - ip route 0.0.0.0 0.0.0.0 Vlan102 192.168.0.129
          - ip route 0.0.0.0 0.0.0.0 Vlan101 192.168.0.65 10
          - ip route 10.2.0.0 255.255.0.0 Vlan101 192.168.0.65
          - ip route 10.2.0.0 255.255.0.0 Vlan102 192.168.0.129 10

    - name: 7.1 SSH versie 2
      cisco.ios.ios_config:
        lines:
          - ip ssh version 2

    - name: 7.2 Console lijn beveiligen
      cisco.ios.ios_config:
        parents: line con 0
        lines:
          - exec-timeout 10 0
          - logging synchronous
          - login local

    - name: 7.3 VTY lijnen (SSH) beveiligen en configuratie opslaan
      cisco.ios.ios_config:
        parents: line vty 0 4
        lines:
          - exec-timeout 10 0
          - login local
          - transport input ssh
        save_when: modified
