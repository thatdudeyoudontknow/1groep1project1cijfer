# Standalone Ansible playbook voor R-ELB-01
# Uitvoeren: ansible-playbook -i 192.168.0.1, new_R-ELB-01_Router-1.yml
---
- name: Configureer R-ELB-01
  hosts: all
  gather_facts: false
  vars:
    ansible_connection: ansible.netcommon.network_cli
    ansible_network_os: cisco.ios.ios
    ansible_user: admin
    ansible_password: "<WACHTWOORD>"
    ansible_become: true
    ansible_become_method: enable
    ansible_become_password: "<WACHTWOORD>"
    router_secret: "<WACHTWOORD>"

  tasks:
    - name: 1. Basisinstellingen
      cisco.ios.ios_config:
        lines:
          - hostname R-ELB-01
          - no ip domain-lookup
          - ip domain-name heh.local
          - enable secret {{ router_secret }}
          - username admin privilege 15 secret {{ router_secret }}
          - service password-encryption

    - name: 2.1 Ingebouwde poort GigabitEthernet0/0/0 uitschakelen
      cisco.ios.ios_config:
        parents: interface GigabitEthernet0/0/0
        lines:
          - description Ongebruikt (alle links zitten op de NIM)
          - shutdown

    - name: 2.2 Ingebouwde poort GigabitEthernet0/0/1 uitschakelen
      cisco.ios.ios_config:
        parents: interface GigabitEthernet0/0/1
        lines:
          - description Ongebruikt (alle links zitten op de NIM)
          - shutdown

    - name: 3.1 VLAN 111 (FW1-transit)
      cisco.ios.ios_config:
        parents: vlan 111
        lines:
          - name FW1-transit

    - name: 3.2 VLAN 112 (SW1-transit)
      cisco.ios.ios_config:
        parents: vlan 112
        lines:
          - name SW1-transit

    - name: 3.3 VLAN 121 (FW2-transit)
      cisco.ios.ios_config:
        parents: vlan 121
        lines:
          - name FW2-transit

    - name: 3.4 VLAN 122 (SW2-transit)
      cisco.ios.ios_config:
        parents: vlan 122
        lines:
          - name SW2-transit

    - name: 4.1 NIM-poort GigabitEthernet0/1/0
      cisco.ios.ios_config:
        parents: interface GigabitEthernet0/1/0
        lines:
          - description ge0/1/0 - FW-ELB-01 lan1
          - switchport mode access
          - switchport access vlan 111
          - spanning-tree portfast
          - no shutdown

    - name: 4.2 NIM-poort GigabitEthernet0/1/1
      cisco.ios.ios_config:
        parents: interface GigabitEthernet0/1/1
        lines:
          - description ge0/1/1 - SW-ELB-01 Gi1/0/1
          - switchport mode access
          - switchport access vlan 112
          - spanning-tree portfast
          - no shutdown

    - name: 4.3 NIM-poort GigabitEthernet0/1/2
      cisco.ios.ios_config:
        parents: interface GigabitEthernet0/1/2
        lines:
          - description ge0/1/2 - FW-ELB-02 lan1
          - switchport mode access
          - switchport access vlan 121
          - spanning-tree portfast
          - no shutdown

    - name: 4.4 NIM-poort GigabitEthernet0/1/3
      cisco.ios.ios_config:
        parents: interface GigabitEthernet0/1/3
        lines:
          - description ge0/1/3 - SW-ELB-02 Gi1/0/1
          - switchport mode access
          - switchport access vlan 122
          - spanning-tree portfast
          - no shutdown

    - name: 5.0 SVI Vlan1 uitschakelen
      cisco.ios.ios_config:
        parents: interface Vlan1
        lines:
          - shutdown

    - name: 5.1 SVI Vlan111
      cisco.ios.ios_config:
        parents: interface Vlan111
        lines:
          - description Transit naar FW-ELB-01
          - ip address 10.1.3.2 255.255.255.248
          - no shutdown

    - name: 5.2 SVI Vlan112
      cisco.ios.ios_config:
        parents: interface Vlan112
        lines:
          - description Transit naar SW-ELB-01
          - ip address 192.168.0.1 255.255.255.252
          - no shutdown

    - name: 5.3 SVI Vlan121
      cisco.ios.ios_config:
        parents: interface Vlan121
        lines:
          - description Transit naar FW-ELB-02
          - ip address 10.1.3.18 255.255.255.248
          - no shutdown

    - name: 5.4 SVI Vlan122
      cisco.ios.ios_config:
        parents: interface Vlan122
        lines:
          - description Transit naar SW-ELB-02
          - ip address 192.168.0.9 255.255.255.252
          - no shutdown

    - name: 6. Statische routes
      cisco.ios.ios_config:
        lines:
          - ip route 0.0.0.0 0.0.0.0 Vlan111 10.1.3.1
          - ip route 0.0.0.0 0.0.0.0 Vlan121 10.1.3.17 10
          - ip route 10.1.1.0 255.255.255.0 Vlan111 10.1.3.1
          - ip route 10.1.1.0 255.255.255.0 Vlan121 10.1.3.17 10
          - ip route 10.1.3.0 255.255.255.0 Vlan111 10.1.3.1
          - ip route 10.1.3.0 255.255.255.0 Vlan121 10.1.3.17 10
          - ip route 10.0.0.0 255.0.0.0 Vlan112 192.168.0.2
          - ip route 10.0.0.0 255.0.0.0 Vlan122 192.168.0.10 10
          - ip route 192.168.0.0 255.255.255.0 Vlan112 192.168.0.2
          - ip route 192.168.0.0 255.255.255.0 Vlan122 192.168.0.10 10

    - name: 7.1 SSH versie 2
      cisco.ios.ios_config:
        lines:
          - ip ssh version 2

    - name: 7.2 Console lijn beveiligen
      cisco.ios.ios_config:
        parents: line con 0
        lines:
          - exec-timeout 10 0
          - logging synchronous
          - login local

    - name: 7.3 VTY lijnen (SSH) beveiligen en configuratie opslaan
      cisco.ios.ios_config:
        parents: line vty 0 4
        lines:
          - exec-timeout 10 0
          - login local
          - transport input ssh
        save_when: modified
