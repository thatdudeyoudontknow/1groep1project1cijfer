---
# Zelfstandig playbook voor SW-DRT-01; geen aanvullende bestanden nodig.
# Uitvoeren: ansible-playbook SW-DRT-01.yml
# Benodigd: ansible-core >= 2.18 en de gebruikte netwerkcollecties.
- name: Verbinding met SW-DRT-01 instellen
  hosts: localhost
  connection: local
  gather_facts: false
  tags:
  - verbinding
  vars:
    switch_ip: 10.3.1.254
    switch_gebruiker: admin
  vars_prompt:
  - name: ssh_wachtwoord
    prompt: Huidig SSH-wachtwoord (<wachtwoord>)
    private: true
  - name: switch_wachtwoord
    prompt: Configuratiewachtwoord (vervanger van <wachtwoord> in de commands)
    private: true
  tasks:
  - name: Controleer de benodigde Ansible-versie
    ansible.builtin.assert:
      that:
      - ansible_version.full is version('2.18', '>=')
      fail_msg: Installeer ansible-core 2.18 of nieuwer.
      quiet: true
  - name: Controleer dat het configuratiewachtwoord een geldig CLI-argument is
    ansible.builtin.assert:
      that:
      - switch_wachtwoord | length > 0
      - (switch_wachtwoord | regex_search('\s')) is none
      fail_msg: Gebruik een niet-leeg wachtwoord zonder spaties of regeleinden.
      quiet: true
    no_log: true
  - name: Registreer deze switch voor de volgende play
    ansible.builtin.add_host:
      name: SW-DRT-01
      ansible_host: '{{ switch_ip }}'
      ansible_user: '{{ switch_gebruiker }}'
      ansible_password: '{{ ssh_wachtwoord }}'
      ansible_connection: ansible.netcommon.network_cli
      ansible_network_os: community.ciscosmb.ciscosmb
      ansible_network_cli_ssh_type: paramiko
      ansible_command_timeout: 120
      ansible_become: false
      switch_wachtwoord: '{{ switch_wachtwoord }}'
    no_log: true
- name: Oorspronkelijke configuratie van SW-DRT-01 automatiseren
  hosts: SW-DRT-01
  gather_facts: false
  tags:
  - configuratie
  vars:
    switch_commands: |
      configure terminal
      ! =====================================================================
      ! SW-DRT-01 - L2 switch 4 (CBS350-8T-E-2G) - Dronten
      ! gi1 trunk 30,31 <- R-DRT-01 Gi0/0/1 · gi2 trunk native 31 -> AP-DRT-01
      ! gi3 access 31 -> tafel 6b6
      ! Plak per blok in "configure terminal"
      ! =====================================================================

      ! ---------- 1. Basis ----------
      hostname SW-DRT-01
      username admin password {{ switch_wachtwoord }} privilege 15

      ! ---------- 2. VLANs ----------
      vlan database
      vlan 30,31,999
      exit
      interface vlan 30
       name Studenten-Gasten
      interface vlan 31
       name Medewerkers
      interface vlan 999
       name Ongebruikt
      exit

      ! ---------- 3. Poorten ----------
      interface GigabitEthernet1
       description Trunk naar R-DRT-01 Gi0/0/1
       switchport mode trunk
       switchport trunk allowed vlan none
       switchport trunk allowed vlan add 30,31
       no shutdown
      interface GigabitEthernet2
       description Trunk naar AP-DRT-01 (native 31, via PoE-injector)
       switchport mode trunk
       switchport trunk native vlan 31
       switchport trunk allowed vlan none
       switchport trunk allowed vlan add 30,31
       spanning-tree portfast
       no shutdown
      interface GigabitEthernet3
       description Access VLAN 31 -> K1P2-6 -> tafel 6b6
       switchport mode access
       switchport access vlan 31
       spanning-tree portfast
       no shutdown
      interface range GigabitEthernet4-10
       description Ongebruikt
       switchport mode access
       switchport access vlan 999
       shutdown
      exit

      ! ---------- 4. Beheeradres ----------
      interface vlan 1
       no ip address dhcp
      interface vlan 31
       ip address 10.3.1.254 255.255.255.0
      exit
      ip default-gateway 10.3.1.1

      ! ---------- 5. Beheer (SSH) ----------
      ip ssh server
      no ip telnet server
      end
      write memory
  tasks:
  - name: Voer alle oorspronkelijke commands in volgorde uit
    ansible.netcommon.cli_command:
      command: '{{ switch_command }}'
      prompt: '{{ [''(?i)Do you really want to replace them\?\s*\[yes/no\]:?''] if switch_command == ''crypto key
        generate rsa modulus 2048'' else omit }}'
      answer: '{{ [''no''] if switch_command == ''crypto key generate rsa modulus 2048'' else omit }}'
    register: switch_command_result
    changed_when: switch_command not in ['configure terminal', 'end', 'exit']
    failed_when: "(switch_command_result is failed) or ((switch_command_result.stdout | default('') |\n  regex_search('(?im)^\\\
      \\s*(?:%\\\\s*(?:Invalid|Incomplete|Ambiguous|Error|Bad|Unrecognized|Unknown|Entry already running)|Invalid\
      \ input|Unrecognized command|Unknown command|Error(?:\\\\s|:)|Cannot modify|Entry already running)')) is not\
      \ none)"
    no_log: '{{ (switch_command | regex_search(''^(?:enable secret |username .* (?:secret|password) )'')) is not
      none }}'
    loop: '{{ switch_commands.splitlines() | map(''trim'') | reject(''equalto'', '''') | reject(''match'', ''^!'')
      | list }}'
    loop_control:
      loop_var: switch_command
      label: '{{ ''<wachtwoordcommand afgeschermd>'' if (switch_command | regex_search(''^(?:enable secret |username
        .* (?:secret|password) )'')) is not none else switch_command }}'
      break_when:
      - switch_command_result is failed or switch_command_result is unreachable
